name: Scaling preparation checks (no training)
on:
  push:
    branches: [planning/additive-width-delay-scaling]
  pull_request:
    paths:
      - "experiments/prepare_additive_scaling.py"
      - "scripts/preflight_additive_scaling.py"
      - "tests/test_prepare_additive_scaling.py"
      - "tests/test_preflight_additive_scaling.py"
      - ".github/workflows/scaling-preflight.yml"
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only pytest (no model dependencies)
        run: python -m pip install pytest
      - name: Validate matrix and preflight
        run: |
          python scripts/preflight_additive_scaling.py
          python -m pytest -q tests/test_prepare_additive_scaling.py tests/test_preflight_additive_scaling.py
