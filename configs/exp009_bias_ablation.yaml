# EXP-009 preregistration. The single trainable preactivation bias, the four
# regimes, the seeds, and the success gate were fixed before any EXP-009
# accuracy was collected.
experiment_id: EXP-009
config_revision: 1
status: preregistered_before_training
device: cpu
model_equation: "candidate_t = tanh(W_h h_{t-1} + W_x x_t + b_h + b_x); h_t = h_{t-1} + candidate_t"
seeds: [101, 113, 127, 139, 151, 163, 179, 191, 211, 223]
delays:
  primary: 64
  secondary: 128
regimes:
  - full
  - readout_only
  - bias_plus_readout
  - matrices_plus_readout
parameter_names:
  W_x: recurrent.weight_ih_l0
  b_x: recurrent.bias_ih_l0
  W_h: recurrent.weight_hh_l0
  b_h: recurrent.bias_hh_l0
  readout_weight: readout.weight
  readout_bias: readout.bias
single_trainable_preactivation_bias: recurrent.bias_ih_l0
bias_choice_rule: "Regime C trains b_x only. This choice is fixed before results and is not switched afterward. b_h stays frozen in regime C."
all_parameters:
  - recurrent.weight_ih_l0
  - recurrent.weight_hh_l0
  - recurrent.bias_ih_l0
  - recurrent.bias_hh_l0
  - readout.weight
  - readout.bias
trainable_by_regime:
  full:
    - recurrent.weight_ih_l0
    - recurrent.weight_hh_l0
    - recurrent.bias_ih_l0
    - recurrent.bias_hh_l0
    - readout.weight
    - readout.bias
  readout_only:
    - readout.weight
    - readout.bias
  bias_plus_readout:
    - recurrent.bias_ih_l0
    - readout.weight
    - readout.bias
  matrices_plus_readout:
    - recurrent.weight_ih_l0
    - recurrent.weight_hh_l0
    - readout.weight
    - readout.bias
frozen_by_regime:
  full: []
  readout_only:
    - recurrent.weight_ih_l0
    - recurrent.weight_hh_l0
    - recurrent.bias_ih_l0
    - recurrent.bias_hh_l0
  bias_plus_readout:
    - recurrent.weight_ih_l0
    - recurrent.weight_hh_l0
    - recurrent.bias_hh_l0
  matrices_plus_readout:
    - recurrent.bias_ih_l0
    - recurrent.bias_hh_l0
expected_trainable_counts:
  full: 1217
  readout_only: 33
  bias_plus_readout: 65
  matrices_plus_readout: 1153
expected_total_parameters: 1217
limitations:
  shared_preactivation: "b_x and b_h are added inside the same preactivation. Training one of them can change the effective bias. This is not the same optimizer trajectory as training both biases in full training."
  readout_bias_is_separate: "readout.bias is the output bias. It is not a preactivation bias. Reports keep the two updates separate."
  clipping: "Gradient clipping is applied only to the trainable set of that regime. Changing the trainable set changes the clipping operation. Not every optimizer effect is isolated."
  not_an_exp008_proof: "A bias-only result does not prove that EXP-008 succeeded by that same route."
  budget: "Failure under 400 updates does not prove another budget could never work."
model:
  type: additive_tanh_rnn
  input_size: 3
  hidden_size: 32
  output_size: 1
  initial_hidden_state: zero
  residual_scale: 1.0
  initialization: "existing nn.RNN and nn.Linear initialization, reseeded per regime"
bound_unchanged: 4.0
training:
  optimizer: Adam
  adam_defaults: "betas (0.9, 0.999), eps 1e-8"
  learning_rate: 0.003
  batch_size: 64
  eval_batch_size: 256
  updates_per_run: 400
  grad_clip_norm: 5.0
  grad_clip_scope: trainable_parameters_only
  loss: binary_cross_entropy_with_logits
  diagnostic_updates: [0, 50, 100, 200, 400]
  checkpoint_selection: final update only
  no_test_accuracy_during_training: true
task:
  run_mode: HARD_V2
  distractor_noise_std: 0.3
  competitor_rate: 0.4
  competitor_flip_prob: 0.5
data:
  train_samples: 1536
  val_samples: 512
  test_samples: 512
  base_seed: 2000
  audit_split_index: 3
  audit_samples: 512
interpretation:
  success_test_accuracy_at_least: 0.95
  delay_128_gate: "fresh delay-128 training for all four regimes only if all 40 delay-64 runs have a terminal record and full training succeeds on at least 8 of 10 delay-64 seeds"
  do_not_pool_with_earlier_counts: true
  matched_cohort: true
  outcomes:
    A: "Bias plus readout reliably succeeds with both matrices fixed."
    B: "Matrices plus readout succeeds, but bias plus readout does not."
    C: "Both restricted regimes succeed."
    D: "Only full training reliably succeeds."
    E: "Full controls fail, or readout-only differs materially from EXP-007 and EXP-008. Investigate before a new mechanism claim."
budget:
  max_cpu_seconds_per_run: 300
  max_cpu_seconds_total: 900
  no_automatic_retry: true
  no_automatic_resume: true
  no_timestamp_runtime_inference: true
  interruption: "If interrupted, preserve completed and partial outputs, identify the affected condition from the runtime log, and stop for coordinator review. Do not resume automatically."
environment_requirement:
  python: "3.11.9"
  torch: "2.13.0+cpu"
outputs:
  directory: results/EXP-009
  refuse_overwrite_of_existing_measurements: true
diagnostics:
  bit_channel: "gradient of the final logit w.r.t. inputs[:, 0, 0]"
  marker_channel: "gradient w.r.t. inputs[:, 0, 1], stored separately"
  checkpoint_probe_split: "validation indices 0:256 fit and 256:512 score"
  final_probe: "fit on all validation states, score on test states"
  exact_state_equality: "direct coordinate equality of the final hidden state"
  computational_zero: "a recorded float equal to 0.0"
  paired_forward_tolerance: 1.0e-5
