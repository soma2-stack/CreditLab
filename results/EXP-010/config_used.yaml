# EXP-010 preregistration. K and the two training regimes were fixed before
# any EXP-010 accuracy was collected.
experiment_id: EXP-010
config_revision: 1
status: preregistered_before_training
device: cpu
model_equation: "candidate_t = tanh(W_h h_{t-1} + W_x x_t + b_h + b_x); h_t = h_{t-1} + candidate_t"
forward_match: direct_equality
gradient_horizon:
  k: 16
  sequence_length: "delay + 2"
  cut: "max(sequence_length - 16, 0)"
  boundary: "After input cut-1, detach the hidden state once. Do not change its value. Then process inputs cut through the final query."
  query_counts_as_one_of_the_16: true
  k_at_least_length: "no detach; this is full-history behavior"
seeds: [101, 113, 127, 139, 151, 163, 179, 191, 211, 223]
delays:
  primary: 64
  secondary: 128
regimes:
  - full_history
  - final_16
model:
  type: additive_tanh_rnn
  input_size: 3
  hidden_size: 32
  output_size: 1
  initial_hidden_state: zero
  residual_scale: 1.0
  all_parameters_trainable: true
bound_unchanged: 4.0
training:
  optimizer: Adam
  adam_defaults: "betas (0.9, 0.999), eps 1e-8"
  learning_rate: 0.003
  batch_size: 64
  eval_batch_size: 256
  updates_per_run: 400
  grad_clip_norm: 5.0
  grad_clip_scope: all_trainable_parameters
  loss: terminal_binary_cross_entropy_with_logits
  updates_per_minibatch: 1
  diagnostic_updates: [0, 50, 100, 200, 400]
  checkpoint_selection: final update only
  no_test_accuracy_during_training: true
task:
  run_mode: HARD_V2
  distractor_noise_std: 0.3
  competitor_rate: 0.4
  competitor_flip_prob: 0.5
data:
  train_samples: 1536
  val_samples: 512
  test_samples: 512
  base_seed: 2000
  audit_split_index: 3
  audit_samples: 512
interpretation:
  success_test_accuracy_at_least: 0.95
  delay_128_gate: "fresh delay-128 training for both regimes only if all 20 delay-64 runs have a terminal record and full-history succeeds on at least 8 of 10 delay-64 seeds"
  do_not_gate_on_final_16: true
  do_not_pool_with_earlier_counts: true
  shared_parameters_limit: "The same weights are used at every timestep. A final-16 update can change earlier forward processing on the next minibatch. Truncated success does not mean the early steps never learn. Truncated failure does not prove a capacity limit."
  separate_gradients: "training_graph measurements include the detach. forward_ measurements use a full differentiable rollout with no detach."
  outcomes:
    A: "Both regimes reliably succeed."
    B: "Full-history succeeds and final-16 training is substantially worse."
    C: "Final-16 training retains bit information but does not answer reliably."
    D: "The full-history control fails to reproduce."
budget:
  max_cpu_seconds_per_run: 300
  max_cpu_seconds_total: 600
  no_automatic_retry: true
  no_automatic_resume: true
  no_timestamp_runtime_inference: true
  interruption: "Preserve completed and partial records, identify the affected condition, and stop for coordinator review."
environment_requirement:
  python: "3.11.9"
  torch: "2.13.0+cpu"
outputs:
  directory: results/EXP-010
diagnostics:
  bit_channel: "forward gradient of the final logit w.r.t. inputs[:, 0, 0], with no detach"
  marker_channel: "forward gradient w.r.t. inputs[:, 0, 1], stored separately"
  training_graph_event: "same event channel through the regime's actual training graph"
  checkpoint_probe_split: "validation indices 0:256 fit and 256:512 score"
  final_probe: "fit on all validation states, score on test states"
  exact_state_equality: "direct coordinate equality of the final hidden state"
  computational_zero: "a recorded float equal to 0.0"
  clipping_limit: "A shorter gradient horizon changes gradient size and can change how often clipping happens. The clip threshold stays 5.0."
