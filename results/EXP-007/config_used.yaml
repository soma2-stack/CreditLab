# EXP-007 preregistration. The training regimes, seeds, and gate were fixed
# before any EXP-007 accuracy was collected.
experiment_id: EXP-007
config_revision: 1
status: preregistered_before_training
device: cpu
seeds: [101, 113, 127, 139, 151, 163, 179, 191, 211, 223]
delays:
  primary: 64
  secondary: 128
models:
  - vanilla_tanh_rnn
  - additive_tanh_rnn
  - bounded_additive_tanh_rnn
regimes:
  - full
  - readout_only
model:
  input_size: 3
  hidden_size: 32
  output_size: 1
  initial_hidden_state: zero
bound:
  B: 4.0
  learned: false
  autograd: ordinary clamp
equations:
  vanilla: "h_t = tanh(W_h h_{t-1} + W_x x_t + b)"
  additive: "h_t = h_{t-1} + tanh(W_h h_{t-1} + W_x x_t + b)"
  bounded_additive: "h_t = clamp(h_{t-1} + tanh(W_h h_{t-1} + W_x x_t + b), -4, 4)"
frozen_parameter_names:
  - recurrent.weight_ih_l0
  - recurrent.weight_hh_l0
  - recurrent.bias_ih_l0
  - recurrent.bias_hh_l0
trainable_readout_parameter_names:
  - readout.weight
  - readout.bias
training:
  optimizer: Adam
  adam_defaults: "betas (0.9, 0.999), eps 1e-8"
  learning_rate: 0.003
  batch_size: 64
  eval_batch_size: 256
  updates_per_run: 400
  grad_clip_norm: 5.0
  loss: binary_cross_entropy_with_logits
  backprop: full backpropagation through time
  diagnostic_updates: [0, 50, 100, 200, 400]
  checkpoint_selection: final update only
  readout_only_note: >
    Adam and gradient clipping for readout-only runs use only the readout
    parameters. Full runs clip all parameters, matching EXP-006. Because the
    clipped set differs, this comparison does not isolate every detail of
    the recurrent update.
task:
  run_mode: HARD_V2
  distractor_noise_std: 0.3
  competitor_rate: 0.4
  competitor_flip_prob: 0.5
data:
  train_samples: 1536
  val_samples: 512
  test_samples: 512
  base_seed: 2000
  train_split_index: 0
  validation_split_index: 1
  test_split_index: 2
  audit_split_index: 3
  audit_samples: 512
interpretation:
  success_test_accuracy_at_least: 0.95
  delay_128_gate: "fresh delay-128 training for all six conditions only if full-training additive succeeds on at least 8 of 10 delay-64 seeds"
  do_not_pool_with_exp006: true
  outcomes:
    A: "Readout-only additive reliably succeeds, so learned recurrent weights are not necessary for this task success."
    B: "Full additive succeeds and readout-only additive fails, consistent with useful recurrent learning under this schedule."
    C: "Readout-only bounded is more reliable than full bounded."
    D: "Both bounded regimes remain unreliable."
    E: "Full-training additive does not reach 8 of 10 delay-64 successes. Stop."
budget:
  max_cpu_seconds_per_run: 300
  max_cpu_seconds_total: 1200
  no_automatic_retry: true
  no_bound_tuning: true
environment_requirement:
  python: "3.11.9"
  torch: "2.13.0+cpu"
outputs:
  directory: results/EXP-007
  refuse_overwrite: true
diagnostics:
  readout_only_state_check: "recurrent weights must stay equal to initialization; hidden states on a fixed batch must stay equal"
  bit_channel: "final test gradient w.r.t. inputs[:, 0, 0] only"
  marker_channel: "stored separately"
  exact_state_equality: "direct coordinate equality in the bit-flip audit"
  computational_zero: "a recorded float equal to 0.0"
  paired_forward_tolerance: "maximum absolute logit difference at most 1e-5 before the first update; vanilla RNN kernels are not bitwise identical across copied modules"
