# EXP-003 preregistration. The 0.5/0.5 mixture and the cutoffs below were
# fixed before any EXP-003 test measurement. Do not change them after seeing
# test accuracy.
experiment_id: EXP-003
config_revision: 1
status: preregistered
seeds: [17, 29, 43]
device: cpu
hypothesis: >
  EXP-002's additive residual may have helped because of a direct state path,
  or because the hidden state was allowed to grow. A fixed half-and-half mix
  keeps a direct path from the previous state while stopping that additive
  growth. If this bounded model still beats the matched vanilla RNN, the
  direct path itself is useful on this task. If it does not, state magnitude
  or the additive update was an important part of the EXP-002 result.
models:
  - vanilla_tanh_rnn
  - bounded_mixture_tanh_rnn
model:
  input_size: 3
  hidden_size: 32
  output_size: 1
mixture:
  formulation: "h_t = previous_weight * h_{t-1} + candidate_weight * tanh(W_h h_{t-1} + W_x x_t + b)"
  previous_weight: 0.5
  candidate_weight: 0.5
  weights_chosen_before_test_results: true
  weights_are_learned: false
  why_these_weights: >
    Equal weights are the smallest fixed mixture that still uses both the
    previous state and the usual tanh candidate. They were not chosen by
    trying values on the test set. Compounding the 0.5 copy alone across 64
    steps leaves almost none of the original state, so this test does not
    claim an undiminished copy of the first hidden state. It asks whether a
    bounded direct mix is enough once simple additive growth is removed.
interpretation:
  success_test_accuracy_at_least: 0.75
  retention_clearly_readable_r2_at_least: 0.5
  controlled_max_abs_hidden_at_most: 1.01
  cutoff_source: >
    Accuracy and retention cutoffs are the same gaps used in EXP-002.
    Magnitude is controlled when the largest absolute hidden entry is at most
    1.01, just above the bound of a convex mix of tanh values. EXP-002's
    additive states grew to about 65 at delay 64 and about 129 at delay 128.
  outcomes:
    direct_path_supported: >
      At delay 64 the bounded model has more successful seeds than the matched
      vanilla model, and every bounded run stays at or below the magnitude
      cutoff. Three of three successes means the EXP-002 accuracy advantage
      survives the bound.
    advantage_lost: >
      At delay 64 the bounded model does not have more successful seeds than
      the matched vanilla model. State magnitude or the additive update may
      be an important part of the EXP-002 result.
    mixed: >
      Accuracy improves while magnitude exceeds the cutoff, or delay 64 and
      delay 128 disagree about whether the bounded model beats vanilla.
task:
  type: delayed_marked_bit
  run_mode: HARD_V2
  primary_delay: 64
  confirmation_delay: 128
  generator: EXP-001B make_split path, unchanged
  inherited_generator_note: >
    make_split applies distractor noise 1.0 only when mode is HARD. HARD_V2
    therefore uses independent competitor bits at rate 0.4 and the EASY noise
    standard deviation 0.3. EXP-003 does not change that helper.
  modes:
    EASY:
      distractor_noise_std: 0.3
    HARD:
      distractor_noise_std: 1.0
      competitor_rate: 0.4
      competitor_flip_prob: 0.5
    HARD_V2:
      distractor_noise_std: 1.0
      competitor_rate: 0.4
      competitor_flip_prob: 0.5
training:
  optimizer: Adam
  learning_rate: 0.003
  batch_size: 64
  eval_batch_size: 256
  updates_per_run: 400
  grad_clip_norm: 5.0
  loss: binary_cross_entropy_with_logits
data:
  train_samples: 1536
  val_samples: 512
  test_samples: 512
  base_seed: 1000
budget:
  stop_on_nan_or_inf: true
  no_automatic_budget_expansion: true
  no_mixture_weight_tuning: true
outputs:
  directory: results/EXP-003
  raw_metrics: raw_metrics.jsonl
  summary_metrics: summary.csv
reference:
  exp002_raw_metrics: results/EXP-002/raw_metrics.jsonl
  note: >
    Hidden-state magnitudes from the saved EXP-002 additive residual are
    copied for comparison. EXP-002 is not rerun.
