# EXP-004 preregistration. B and every rule below were fixed before any
# EXP-004 performance result. Do not change them after seeing accuracy.
experiment_id: EXP-004
config_revision: 1
status: preregistered_before_training
seeds: [17, 29, 43]
device: cpu
question: >
  Does the additive recurrent update keep its delayed-learning advantage
  when hidden-state magnitude is limited by one fixed clamp, without
  shrinking the previous state on every timestep?
models:
  - vanilla_tanh_rnn
  - additive_tanh_rnn
  - bounded_additive_tanh_rnn
model:
  input_size: 3
  hidden_size: 32
  output_size: 1
  initial_hidden_state: zero
equations:
  vanilla: "h_t = tanh(W_h h_{t-1} + W_x x_t + b)"
  additive: "h_t = h_{t-1} + tanh(W_h h_{t-1} + W_x x_t + b)"
  bounded_additive: "h_t = clamp(h_{t-1} + tanh(W_h h_{t-1} + W_x x_t + b), min=-B, max=B)"
bound:
  B: 4.0
  chosen_before_test_results: true
  learned: false
  autograd: standard clamp; no straight-through estimator and no custom backward
  limitation: >
    Coordinates whose proposed value is outside [-B, B] receive zero local
    gradient through the clamp. That effect is part of the measurement.
task:
  type: delayed_marked_bit
  run_mode: HARD_V2
  primary_delay: 64
  secondary_delay: 128
  distractor_noise_std: 0.3
  competitor_rate: 0.4
  competitor_flip_prob: 0.5
  competitor_bits: independent balanced bits, not copied from the target
  generator_note: >
    EXP-004 passes distractor_noise_std 0.3 and competitor_rate 0.4 directly
    into generate_batch for HARD_V2. It uses the same combined seed formula
    as make_split. Historical YAML files that list HARD_V2 noise as 1.0 are
    not edited. Noise is not changed to 1.0.
training:
  optimizer: Adam
  adam_defaults: "betas (0.9, 0.999), eps 1e-8, no weight decay"
  learning_rate: 0.003
  batch_size: 64
  eval_batch_size: 256
  updates_per_run: 400
  grad_clip_norm: 5.0
  loss: binary_cross_entropy_with_logits
  backprop: full backpropagation through time
  checkpoint_selection: final update only; test accuracy is not used to pick a checkpoint
  diagnostic_updates: [0, 50, 100, 200, 400]
data:
  train_samples: 1536
  val_samples: 512
  test_samples: 512
  base_seed: 1000
  minibatch_rng: "random.Random(seed * 7919 + delay)"
  intermediate_retention_split: "fixed validation halves, indices 0:256 fit and 256:512 score"
  final_retention: "fit on all validation states, score on held-out test states"
interpretation:
  success_test_accuracy_at_least: 0.95
  active_clipping_fraction_at_least: 0.01
  active_clipping_definition: >
    At the final checkpoint, at least 1 percent of hidden-coordinate updates
    on the fixed validation rollout have proposed value outside [-4, 4]
    before the clamp. This is a reporting convention. The continuous fraction
    and its timestep distribution are always saved.
  delay_128_gate: >
    Run fresh delay-128 training only if the additive control has at least
    two successful seeds at delay 64. Otherwise stop and report a
    replication problem. Do not tune, retry, or replace seeds.
  outcomes:
    A: "Additive succeeds and bounded additive succeeds while clipping is active. Growth to the historical magnitudes was not necessary in this setup. This does not prove an identity gradient survived clipping."
    B: "Additive succeeds and bounded additive fails. This fixed bound disrupts the successful update. Magnitude requirements and clamp-gradient effects remain unresolved."
    C: "Bounded additive succeeds but clipping is mostly inactive. The bound was not a strong intervention on the measured rollout."
    D: "Fresh additive control does not reach two successes at delay 64. Stop. Do not interpret the bounded comparison as a mechanism result."
  incomplete_runs: "Budget stops and numerical failures count as unsuccessful and are also reported separately."
diagnostics:
  final_metrics:
    - test_accuracy
    - test_loss
    - train_loss_curve
    - validation_loss_and_accuracy_at_checkpoints
    - retention_probe_val_fit_test_score
    - early_event_margin_sensitivity
    - early_event_loss_gradient_mean_median_p95
    - max_abs_hidden
    - final_hidden_rms
    - parameter_gradient_clip_fraction
    - numerical_stability
    - updates_completed
    - runtime_seconds
  checkpoint_metrics_on_fixed_validation: [0, 50, 100, 200, 400]
  test_accuracy_during_training: false
  gradient_precision: "JSON full float precision; tiny nonzero values are not rounded to zero"
  clipping:
    measured_before_clamp: true
    fields:
      - coordinate_fraction_outside_bounds
      - fraction_by_timestep
      - fraction_at_each_checkpoint
      - fraction_of_examples_with_any_clipping
      - proposed_magnitude_before_clamp
      - actual_magnitude_after_clamp
budget:
  max_cpu_seconds_per_run: 300
  stop_on_nan_or_inf: true
  no_automatic_retry: true
  no_bound_tuning: true
  no_hyperparameter_sweep: true
outputs:
  directory: results/EXP-004
  raw_metrics: raw_metrics.jsonl
  summary_metrics: summary.csv
  refuse_overwrite: true
matching:
  shared_per_seed_delay:
    - dataset tensors, labels, and metadata
    - initial trainable parameters
    - minibatch index lists
    - evaluation and diagnostic examples
    - optimizer constructor and training step
  fingerprints: sha256 of tensor bytes and of the minibatch index list
environment_expectation:
  note: "Recorded at preregistration and checked again before training. Do not install a substitute."
